<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTools Hub | Free Client-Side Developer Utilities</title>
    <meta name="description" content="Free online developer tools: Base64 encoder, JWT decoder, binary converter. 100% client-side processing with zero server logging.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">
    <header class="bg-slate-900 text-white border-b border-slate-800 py-4 relative z-50">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-tight">&lt;/&gt; DevTools Hub</a>
            <nav id="tool-nav" class="flex gap-4 text-xs items-center"></nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
        <section id="tool-viewport" data-active-tool="base64" class="bg-white p-6 rounded-xl border border-slate-200">
            <!-- Hydrated dynamically -->
        </section>

		<!-- Dynamic Discovery Container -->
		<section id="tool-discovery" class="space-y-6"></section>
		<div id="requirement-banner"></div>
		<!-- Dynamic Donation Banner Container -->
		<div id="donation-banner"></div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-4 text-xs text-center border-t border-slate-800">
        <p>&copy; DevTools Hub. 100% Private & Client-Side.</p>
    </footer>

    <script src="js/registry.js"></script>
    <script src="js/tools/base64.js"></script>
    <script src="js/tools/jwt.js"></script>
    <script src="js/tools/binary.js"></script>
	<script src="js/tools/pdfToMd.js"></script>
	<script src="js/tools/html-formatter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
